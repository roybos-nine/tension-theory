  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

93, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7691afdb-453f-4685-84f2-847ca8051df5\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4118a5c7-e8d9-4c00-be56-f8c497c7f03c\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"177d611c-efd3-47f9-b94f-788170b019d7\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4b8a7962-9afb-4086-8a02-276576050b94\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1cd42eaf-8f7a-45a5-96e6-29857d8983e6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    html { scroll-behavior: smooth; }\n    body { margin: 0; background: #0b0c0e; color: #e8e6e1; font-family: 'Spectral', Georgia, serif; -webkit-font-smoothing: antialiased; }\n    a { color: #ff5c33; text-decoration: none; }\n    a:hover { color: #ff8a66; }\n    ::selection { background: #ff5c33; color: #0b0c0e; }\n    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; background:#0b0c0e;\">\n\n  <!-- ============ HERO ============ -->\n  <header data-screen-label=\"Hero\" style=\"position:relative; min-height:100vh; display:flex; flex-direction:column; overflow:hidden;\">\n    <div style=\"position:absolute; inset:0; opacity:0.85;\">\n      <x-import component-from-global-scope=\"tension-sim\" accent=\"{{ accent }}\" density=\"{{ simDensity }}\" style=\"width:100%; height:100%;\" hint-size=\"100%,100%\"><\u002Fx-import>\n    <\u002Fdiv>\n    <div style=\"position:absolute; inset:0; background:radial-gradient(ellipse at 50% 60%, rgba(11,12,14,0.2) 0%, rgba(11,12,14,0.82) 75%); pointer-events:none;\"><\u002Fdiv>\n\n    <nav style=\"position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:28px 48px; font-family:'IBM Plex Mono', monospace; font-size:13px;\">\n      <div style=\"display:flex; align-items:center; gap:10px; letter-spacing:0.08em; color:#e8e6e1;\">\n        <span style=\"display:inline-block; width:9px; height:9px; background:{{ accent }};\"><\u002Fspan>\n        TENSION THEORY\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:28px; letter-spacing:0.05em;\">\n        <a href=\"#idea\" style=\"color:#9a978f;\" style-hover=\"color:#e8e6e1;\">Idea<\u002Fa>\n        <a href=\"#rules\" style=\"color:#9a978f;\" style-hover=\"color:#e8e6e1;\">Rules<\u002Fa>\n        <a href=\"#emergence\" style=\"color:#9a978f;\" style-hover=\"color:#e8e6e1;\">Emergence<\u002Fa>\n        <a href=\"#predictions\" style=\"color:#9a978f;\" style-hover=\"color:#e8e6e1;\">Predictions<\u002Fa>\n        <a href=\"{{ pdfHref }}\" target=\"_blank\" style=\"color:{{ accent }};\">Paper ↗<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fnav>\n\n    <div style=\"position:relative; z-index:2; flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 48px; max-width:1100px; margin:0 auto; width:100%; box-sizing:border-box;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.14em; color:{{ accent }}; margin-bottom:24px; animation:fadeUp 0.9s ease both;\">A CANDIDATE THEORY OF EVERYTHING · v0.1<\u002Fdiv>\n      <h1 style=\"font-family:'Space Grotesk', sans-serif; font-size:clamp(52px, 8.5vw, 118px); font-weight:600; line-height:0.98; letter-spacing:-0.03em; margin:0 0 32px; animation:fadeUp 0.9s 0.1s ease both;\">Reality is<br>tension, resolving.<\u002Fh1>\n      <p style=\"font-size:clamp(19px, 2vw, 24px); font-weight:300; line-height:1.55; color:#b8b5ad; max-width:620px; margin:0 0 44px; animation:fadeUp 0.9s 0.2s ease both;\">A minimal framework in which the universe is a finite-memory system updating itself, one local step at a time — and time, space, particles, and observation are what that process looks like from the inside.<\u002Fp>\n      <div style=\"display:flex; gap:16px; flex-wrap:wrap; animation:fadeUp 0.9s 0.3s ease both;\">\n        <a href=\"{{ pdfHref }}\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:10px; background:{{ accent }}; color:#0b0c0e; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; padding:15px 28px; letter-spacing:0.01em;\" style-hover=\"background:#e8e6e1;\">Read the paper (PDF)<\u002Fa>\n        <a href=\"https://github.com/roybos-nine/tension-theory\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:10px; border:1px solid #3a3a38; color:#e8e6e1; font-family:'Space Grotesk', sans-serif; font-weight:500; font-size:16px; padding:15px 28px;\" style-hover=\"border-color:#e8e6e1;\">GitHub<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:relative; z-index:2; padding:24px 48px; display:flex; justify-content:space-between; font-family:'IBM Plex Mono', monospace; font-size:12px; color:#6b6963; letter-spacing:0.06em;\">\n      <span>↑ LIVE — a graph of finite-state nodes resolving tension locally<\u002Fspan>\n      <span>SCROLL ↓<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ THE IDEA ============ -->\n  <section id=\"idea\" data-screen-label=\"The Idea\" style=\"max-width:1100px; margin:0 auto; padding:140px 48px 100px;\">\n    <div style=\"display:grid; grid-template-columns:220px 1fr; gap:48px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.14em; color:{{ accent }};\">01 — THE IDEA<\u002Fdiv>\n      <div>\n        <h2 style=\"font-family:'Space Grotesk', sans-serif; font-size:clamp(34px, 4vw, 52px); font-weight:600; line-height:1.1; letter-spacing:-0.02em; margin:0 0 36px;\">Physics describes what happens. This asks how reality <em style=\"color:{{ accent }}; font-style:normal;\">runs<\u002Fem>.<\u002Fh2>\n        <div style=\"font-size:20px; font-weight:300; line-height:1.7; color:#b8b5ad; display:flex; flex-direction:column; gap:24px;\">\n          <p style=\"margin:0;\">Our best theories use infinite-precision fields, continuous space-time, and global wave functions. They predict beautifully — but they say nothing about the <em>mechanism<\u002Fem> by which the universe updates itself, and they quietly assume unlimited memory and zero-cost change.<\u002Fp>\n          <p style=\"margin:0;\">Tension Theory starts from the opposite end: any system that evolves must store state, update it locally, and pay a cost to do so. The single primitive is <strong style=\"color:#e8e6e1; font-weight:400; border-bottom:1px solid {{ accent }};\">tension<\u002Fstrong> — the constrained informational difference between neighboring states. Tension is both the pressure to change and the price of changing.<\u002Fp>\n          <p style=\"margin:0;\">Everything else — time, space, causality, particles, fields, probability, even measurement — falls out as what a finite, local, tension-driven system inevitably looks like from within.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ RULES / POSTULATES ============ -->\n  <section id=\"rules\" data-screen-label=\"The Rules\" style=\"background:#101114; border-top:1px solid #1e1f22; border-bottom:1px solid #1e1f22;\">\n    <div style=\"max-width:1100px; margin:0 auto; padding:120px 48px;\">\n      <div style=\"display:grid; grid-template-columns:220px 1fr; gap:48px; margin-bottom:64px;\">\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.14em; color:{{ accent }};\">02 — THE RULES<\u002Fdiv>\n        <div>\n          <h2 style=\"font-family:'Space Grotesk', sans-serif; font-size:clamp(34px, 4vw, 52px); font-weight:600; line-height:1.1; letter-spacing:-0.02em; margin:0 0 20px;\">Ten postulates. Nothing else.<\u002Fh2>\n          <p style=\"font-size:19px; font-weight:300; line-height:1.65; color:#b8b5ad; margin:0; max-width:600px;\">The whole theory rests on these assumptions — finite memory, local interaction, costly change. No continuity, probability, or geometry is put in by hand.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:1px; background:#1e1f22; border:1px solid #1e1f22;\">\n        <sc-for list=\"{{ postulates }}\" as=\"p\" hint-placeholder-count=\"10\">\n          <div style=\"background:#101114; padding:32px 28px;\" style-hover=\"background:#15161a;\">\n            <div style=\"display:flex; align-items:baseline; gap:14px; margin-bottom:12px;\">\n              <span style=\"font-family:'IBM Plex Mono', monospace; font-size:12px; color:{{ accent }};\">{{ p.num }}<\u002Fspan>\n              <span style=\"font-family:'Space Grotesk', sans-serif; font-size:19px; font-weight:600; color:#e8e6e1;\">{{ p.name }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0; font-size:16px; font-weight:300; line-height:1.6; color:#9a978f;\">{{ p.text }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ EMERGENCE ============ -->\n  <section id=\"emergence\" data-screen-label=\"Emergence\" style=\"max-width:1100px; margin:0 auto; padding:140px 48px;\">\n    <div style=\"display:grid; grid-template-columns:220px 1fr; gap:48px; margin-bottom:72px;\">\n      <div style=\"font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.14em; color:{{ accent }};\">03 — EMERGENCE<\u002Fdiv>\n      <div>\n        <h2 style=\"font-family:'Space Grotesk', sans-serif; font-size:clamp(34px, 4vw, 52px); font-weight:600; line-height:1.1; letter-spacing:-0.02em; margin:0 0 20px;\">Nothing fundamental is added. Familiar physics falls out.<\u002Fh2>\n        <p style=\"font-size:19px; font-weight:300; line-height:1.65; color:#b8b5ad; margin:0; max-width:600px;\">Seven things we usually treat as primitives turn out to be regularities of the update process.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column;\">\n      <sc-for list=\"{{ emergents }}\" as=\"e\" hint-placeholder-count=\"7\">\n        <div style=\"display:grid; grid-template-columns:220px 260px 1fr; gap:48px; padding:36px 0; border-top:1px solid #1e1f22; align-items:baseline;\">\n          <div style=\"font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:600; color:#e8e6e1;\">{{ e.name }}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono', monospace; font-size:14px; color:{{ accent }}; line-height:1.5;\">= {{ e.equation }}<\u002Fdiv>\n          <p style=\"margin:0; font-size:17px; font-weight:300; line-height:1.65; color:#9a978f;\">{{ e.text }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PREDICTIONS ============ -->\n  <section id=\"predictions\" data-screen-label=\"Predictions\" style=\"background:#101114; border-top:1px solid #1e1f22; border-bottom:1px solid #1e1f22;\">\n    <div style=\"max-width:1100px; margin:0 auto; padding:120px 48px;\">\n      <div style=\"display:grid; grid-template-columns:220px 1fr; gap:48px; margin-bottom:64px;\">\n        <div style=\"font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.14em; color:{{ accent }};\">04 — PREDICTIONS<\u002Fdiv>\n        <div>\n          <h2 style=\"font-family:'Space Grotesk', sans-serif; font-size:clamp(34px, 4vw, 52px); font-weight:600; line-height:1.1; letter-spacing:-0.02em; margin:0 0 20px;\">Where it could break.<\u002Fh2>\n          <p style=\"font-size:19px; font-weight:300; line-height:1.65; color:#b8b5ad; margin:0; max-width:600px;\">The framework is falsifiable in principle. If any of these fail, the theory fails.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; max-width:820px; margin-left:auto;\">\n        <sc-for list=\"{{ predictions }}\" as=\"pr\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex; gap:28px; padding:28px 0; border-top:1px solid #1e1f22;\">\n            <span style=\"font-family:'IBM Plex Mono', monospace; font-size:13px; color:{{ accent }}; padding-top:4px; flex-shrink:0;\">P{{ pr.num }}<\u002Fspan>\n            <div>\n              <div style=\"font-family:'Space Grotesk', sans-serif; font-size:20px; font-weight:600; margin-bottom:8px; color:#e8e6e1;\">{{ pr.name }}<\u002Fdiv>\n              <p style=\"margin:0; font-size:17px; font-weight:300; line-height:1.65; color:#9a978f;\">{{ pr.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ STATUS + CTA ============ -->\n  <section data-screen-label=\"Status\" style=\"max-width:1100px; margin:0 auto; padding:140px 48px 120px; text-align:center;\">\n    <div style=\"font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.14em; color:{{ accent }}; margin-bottom:28px;\">05 — STATUS<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk', sans-serif; font-size:clamp(34px, 4.5vw, 56px); font-weight:600; line-height:1.12; letter-spacing:-0.02em; margin:0 auto 28px; max-width:800px;\">Incomplete by design. Built to be tested — and broken.<\u002Fh2>\n    <p style=\"font-size:19px; font-weight:300; line-height:1.7; color:#b8b5ad; max-width:640px; margin:0 auto 48px;\">v0.1 is structural, not quantitative. The tension function needs a concrete form, the mapping to known constants is open, and everything must ultimately survive simulation. That's the point: predictions come from running the model, not solving idealized equations.<\u002Fp>\n    <div style=\"display:flex; gap:16px; justify-content:center; flex-wrap:wrap;\">\n      <a href=\"{{ pdfHref }}\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:10px; background:{{ accent }}; color:#0b0c0e; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; padding:15px 28px;\" style-hover=\"background:#e8e6e1;\">Download the paper<\u002Fa>\n      <a href=\"https://github.com/roybos-nine/tension-theory\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:10px; border:1px solid #3a3a38; color:#e8e6e1; font-family:'Space Grotesk', sans-serif; font-weight:500; font-size:16px; padding:15px 28px;\" style-hover=\"border-color:#e8e6e1;\">Follow on GitHub<\u002Fa>\n      <a href=\"https://x.com/roybos_nine\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:10px; border:1px solid #3a3a38; color:#e8e6e1; font-family:'Space Grotesk', sans-serif; font-weight:500; font-size:16px; padding:15px 28px;\" style-hover=\"border-color:#e8e6e1;\">@roybos_nine<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"border-top:1px solid #1e1f22;\">\n    <div style=\"max-width:1100px; margin:0 auto; padding:36px 48px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px; font-family:'IBM Plex Mono', monospace; font-size:12px; color:#6b6963; letter-spacing:0.04em;\">\n      <span>Tension Theory — The Theory of Everything (v0.1) · © 2026 Roybos Nine<\u002Fspan>\n      <span><a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" style=\"color:#6b6963;\" style-hover=\"color:#e8e6e1;\">CC BY 4.0<\u002Fa><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;accent&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#ff5c33&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#ff5c33&quot;, &quot;#4f8dff&quot;, &quot;#2fbf8f&quot;, &quot;#e8c33d&quot;], &quot;section&quot;: &quot;Theme&quot; },\n  &quot;simDensity&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1, &quot;min&quot;: 0.4, &quot;max&quot;: 2, &quot;step&quot;: 0.1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Hero simulation&quot; }\n}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      accent: this.props.accent ?? '#ff5c33',\n      pdfHref: (window.__resources && window.__resources.paperPdf) || 'uploads/Tension_Theory_v0.1.pdf',\n      simDensity: String(this.props.simDensity ?? 1),\n      postulates: [\n        { num: 'P1', name: 'Finite Memory', text: 'Any evolving system has finite capacity to store state. No lossless or infinite memory exists.' },\n        { num: 'P2', name: 'Local State', text: 'State is defined locally. A system sees only adjacent or coupled states, never a global configuration.' },\n        { num: 'P3', name: 'Cost of Update', text: 'Every state transition has a non-zero informational cost, expressed as tension. Zero-cost change is impossible.' },\n        { num: 'P4', name: 'Tension as Primitive', text: 'Tension — constrained informational difference between states — is the fundamental quantity governing evolution.' },\n        { num: 'P5', name: 'Discrete Updates', text: 'All evolution occurs in discrete steps. Continuity is an emergent approximation.' },\n        { num: 'P6', name: 'Irreversibility', text: 'Updates are generally irreversible. Perfect reversal would require infinite memory.' },\n        { num: 'P7', name: 'Relational Structure', text: 'No absolute space or background geometry. Structure arises from relations between states.' },\n        { num: 'P8', name: 'Emergent Time', text: 'Time is not fundamental — it is the ordering of irreversible updates under memory constraints.' },\n        { num: 'P9', name: 'Observation as Coupling', text: 'Observation is a physical interaction that redistributes tension. No external observer, no special measurement rule.' },\n        { num: 'P10', name: 'Stability via Constraint', text: 'Persistent forms are configurations where tension gradients locally balance. Instability is unresolved tension.' },\n      ],\n      emergents: [\n        { name: 'Time', equation: 'ordered irreversibility', text: 'Updates cost, overwrite prior state, and cannot be undone — so the system acquires a natural arrow. Time is what accumulated, non-reversible change feels like.' },\n        { name: 'Space', equation: 'stable relational graph', text: 'Nodes that keep stable, low-tension connections form neighborhoods. Distance is relational — counted in updates and propagation delay, not meters.' },\n        { name: 'Causality', equation: 'dependency under locality', text: 'A state causes another only through adjacency, a tension gradient, and an update that depends on it. No action at a distance — apparent non-locality is stored correlation.' },\n        { name: 'Particles', equation: 'stable tension loops', text: 'Localized configurations that circulate tension internally and resist dispersion. Identity is a maintained pattern, not a substance. Creation and annihilation are formation and collapse.' },\n        { name: 'Fields', equation: 'large-scale tension gradients', text: 'Not entities but statistical regularities: tension varying smoothly across many nodes. Field equations are coarse-grained descriptions of aggregate update dynamics.' },\n        { name: 'Probability', equation: 'incomplete local knowledge', text: 'Finite memory and local access make full configurations unknowable. Randomness reflects information loss, not intrinsic indeterminism.' },\n        { name: 'Observation', equation: 'constrained coupling', text: 'When observer and target interact, tension redistributes and both change; alternatives collapse because memory is overwritten. Collapse is just an update.' },\n      ],\n      predictions: [\n        { num: '1', name: 'No perfect reversibility', text: 'Fundamental lower bounds on reversibility beyond standard thermodynamics, observable in sufficiently isolated, high-precision systems.' },\n        { num: '2', name: 'All influence is local', text: 'No experiment can use entanglement to transmit information without a mediating interaction history — even in principle.' },\n        { num: '3', name: 'Memory-limited precision', text: 'At small enough scales or long enough durations, physical constants show discretization or drift consistent with bounded state representation.' },\n        { num: '4', name: 'Observation has a cost', text: 'Regimes exist where measurement back-action exceeds standard quantum limits — driven by memory overwrite, not uncertainty relations.' },\n        { num: '5', name: 'Continuum models break', text: 'When update granularity becomes comparable to system scale, continuum-based predictions deviate — without invoking quantum gravity.' },\n        { num: '6', name: 'Everything is simulable', text: 'No physically realizable process requires non-local or infinite-memory computation. The universe is executable.' },\n      ],\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
